name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir google-generativeai PyGithub

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        shell: python
        run: |
          import os
          import sys
          import google.generativeai as genai
          from github import Github, Auth

          # 1. 초기 설정
          repo_token = os.getenv('GITHUB_TOKEN')
          gemini_api_key = os.getenv('GEMINI_API_KEY')
          repo_name = os.getenv('REPO_NAME')
          pr_number = int(os.getenv('PR_NUMBER'))

          # 2. Gemini 설정
          genai.configure(api_key=gemini_api_key)

          def analyze_code(diff_content):
              # [수정 완료] 로그에서 확인된 'models/gemini-2.0-flash' 사용
              # 1.5보다 훨씬 빠르고 똑똑한 최신 모델입니다.
              model = genai.GenerativeModel('models/gemini-2.0-flash-exp')
              
              full_prompt = f"""
              당신은 토스(Toss)의 'Frontend Chapter Lead'입니다.
              가독성, 예측 가능성, 응집도, 결합도를 기준으로 리뷰하며 정중한 한국어로 답변하세요.
              개선이 필요한 부분에 대해 구체적인 코드 예시를 포함하여 제안해 주세요.

              [리뷰할 코드 변경점]
              {diff_content}
              """
              
              response = model.generate_content(contents=full_prompt)
              return response.text

          # 3. 메인 실행 로직
          try:
              auth = Auth.Token(repo_token)
              g = Github(auth=auth)
              repo = g.get_repo(repo_name)
              pr = repo.get_pull(pr_number)

              print(f"Checking PR #{pr_number} in {repo_name}...")

              diffs = []
              for file in pr.get_files():
                  if file.filename.endswith(('.js', '.jsx', '.ts', '.tsx', '.css', '.scss', '.html')):
                      patch = file.patch if file.patch else "No content"
                      diffs.append(f"파일명: {file.filename}\n변경사항:\n{patch[:2000]}\n")

              if not diffs:
                  print("리뷰할 프론트엔드 변경 사항이 없습니다.")
              else:
                  print("Gemini 2.0 Flash에게 분석 요청 중...")
                  review_result = analyze_code("\n".join(diffs))
                  
                  print("PR 댓글 작성 중...")
                  pr.create_issue_comment(review_result)
                  print("리뷰 완료!")

          except Exception as e:
              print(f"❌ 에러 발생: {str(e)}")
              sys.exit(1)