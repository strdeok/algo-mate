name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai PyGithub

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        shell: python
        run: |
          import os
          import google.generativeai as genai
          from github import Github, Auth

          repo_token = os.getenv('GITHUB_TOKEN')
          gemini_api_key = os.getenv('GEMINI_API_KEY')
          repo_name = os.getenv('REPO_NAME')
          pr_number = int(os.getenv('PR_NUMBER'))

          genai.configure(api_key=gemini_api_key)

          SYSTEM_INSTRUCTION = """
          당신은 토스(Toss)의 'Frontend Chapter Lead'입니다.
          당신은 동료의 코드가 '변경하기 쉬운 코드'인지 4가지 핵심 기준(가독성, 예측 가능성, 응집도, 결합도)에 맞춰 리뷰합니다.
          [리뷰 핵심 철학] "좋은 코드는 변경하기 쉬운 코드다."
          [4가지 평가 기준] 1. 가독성 2. 예측 가능성 3. 응집도 4. 결합도
          [작성 가이드] 개선이 필요한 부분만 지적, 구체적 코드 예시 포함, 한국어로 정중하게 작성.
          """

          def get_pr_diff(repo, pr_num):
              pr = repo.get_pull(pr_num)
              diffs = []
              for file in pr.get_files():
                  if file.filename.endswith(('.js', '.jsx', '.ts', '.tsx', '.css', '.scss', '.html')):
                      patch = file.patch if file.patch else "No content"
                      diffs.append(f"File: {file.filename}\nDiff:\n{patch[:2000]}\n")
              return "\n".join(diffs)

          def analyze_code(diff_content):
              # 404 에러 방지를 위해 명시적으로 모델 설정
              model = genai.GenerativeModel(
                  model_name="gemini-1.5-flash"
              )
              prompt = f"{SYSTEM_INSTRUCTION}\n\n아래 변경된 코드를 리뷰해주세요.\n\n[Changes]\n{diff_content}"
              
              response = model.generate_content(prompt)
              return response.text

          try:
              # DeprecationWarning 방지를 위해 Auth 객체 사용
              auth = Auth.Token(repo_token)
              g = Github(auth=auth)
              repo = g.get_repo(repo_name)
              
              print(f"Checking PR #{pr_number} in {repo_name}...")
              diff_content = get_pr_diff(repo, pr_number)
              
              if not diff_content:
                  print("No changes detected in frontend files.")
              else:
                  print("Sending to Gemini...")
                  review_result = analyze_code(diff_content)
                  
                  print("Posting comment...")
                  repo.get_pull(pr_number).create_issue_comment(review_result)
                  print("Success!")
          except Exception as e:
              print(f"Error occurred: {e}")
              import traceback
              traceback.print_exc() # 상세 에러 확인용
              exit(1)
