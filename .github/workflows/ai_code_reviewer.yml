name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # 호환성이 가장 좋은 3.11 사용

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir google-generativeai PyGithub

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        shell: python
        run: |
          import os
          import sys
          import google.generativeai as genai
          from github import Github, Auth

          # 1. 환경 변수 로드
          repo_token = os.getenv('GITHUB_TOKEN')
          gemini_api_key = os.getenv('GEMINI_API_KEY')
          repo_name = os.getenv('REPO_NAME')
          pr_number = int(os.getenv('PR_NUMBER'))

          # 2. Gemini 설정
          genai.configure(api_key=gemini_api_key)

          def analyze_code(diff_content):
              # 404 에러 방지를 위한 전체 경로 지정 및 모델 선언
              model = genai.GenerativeModel(model_name='models/gemini-1.5-flash')
              
              # 역할 및 지침을 프롬프트에 직접 포함 (v1beta 이슈 회피)
              full_prompt = f"""
              당신은 토스(Toss)의 'Frontend Chapter Lead'입니다.
              가독성, 예측 가능성, 응집도, 결합도 4가지 기준으로 코드를 리뷰합니다.
              개선이 필요한 부분만 정중하게 한국어로 답변하세요. 구체적인 코드 예시를 포함하면 좋습니다.

              [Changes to Review]
              {diff_content}
              """
              
              response = model.generate_content(full_prompt)
              return response.text

          # 3. 메인 실행 로직
          try:
              auth = Auth.Token(repo_token)
              g = Github(auth=auth)
              repo = g.get_repo(repo_name)
              pr = repo.get_pull(pr_number)

              diffs = []
              for file in pr.get_files():
                  # 프론트엔드 관련 파일 확장자 체크
                  if file.filename.endswith(('.js', '.jsx', '.ts', '.tsx', '.css', '.scss', '.html')):
                      patch = file.patch if file.patch else "No content"
                      diffs.append(f"File: {file.filename}\nDiff:\n{patch[:2000]}\n")

              if not diffs:
                  print("No frontend changes to review.")
              else:
                  print("Sending data to Gemini...")
                  review_result = analyze_code("\n".join(diffs))
                  
                  print("Posting comment to PR...")
                  pr.create_issue_comment(review_result)
                  print("Review posted successfully!")

          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)
